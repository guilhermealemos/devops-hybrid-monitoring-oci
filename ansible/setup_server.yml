---
- name: Preparação e Hardening do Servidor de Monitoramento
  hosts: monitoring_servers
  become: true

  tasks:
    - name: Atualizar cache do APT e fazer upgrade de pacotes
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Instalar pacotes essenciais de sistema
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - htop
          - net-tools
          - git
          - ufw
        state: present

    - name: Criar diretório para keyrings do apt
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Baixar chave GPG oficial do Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Adicionar repositório oficial do Docker (ARM64)
      apt_repository:
        repo: "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Instalar Docker Engine e Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Garantir que o serviço do Docker esteja ativo e habilitado no boot
      service:
        name: docker
        state: started
        enabled: yes

    - name: Adicionar o usuário 'ubuntu' ao grupo docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Ajustar permissão do socket do Docker
      file:
        path: /var/run/docker.sock
        mode: '0666'
